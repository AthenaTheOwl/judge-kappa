name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e . pytest
      - name: pytest
        run: python -m pytest -q
      - name: acceptance - textbook kappa fails the 0.6 bar
        run: |
          set +e
          judge-kappa examples/textbook/gold.csv examples/textbook/judge.csv
          test $? -eq 1
      - name: acceptance - one-label gold set gives an undefined kappa, exit 3
        run: |
          set +e
          judge-kappa examples/one_label/gold.csv examples/one_label/judge.csv
          test $? -eq 3
      - name: acceptance - pairwise judge passes all three checks
        run: judge-kappa examples/pairwise/gold.csv examples/pairwise/run1.csv --retest examples/pairwise/run2.csv --swapped examples/pairwise/swapped.csv
      - name: acceptance - evidence-first fixture, claim_first kappa 0.50 exit 1, evidence_first kappa 1.00 exit 0
        run: |
          judge-kappa examples/evidence_first/gold.csv examples/evidence_first/evidence_first.csv | tee ef.txt
          grep -q 'kappa_vs_gold        1.000' ef.txt
          set +e
          judge-kappa examples/evidence_first/gold.csv examples/evidence_first/claim_first.csv > cf.txt
          code=$?
          set -e
          cat cf.txt
          test $code -eq 1
          grep -q 'kappa_vs_gold        0.500' cf.txt
          rm -f ef.txt cf.txt
      - name: acceptance - five runs, a gate margin inside the noise fails
        run: |
          runs="--retest examples/pairwise/run2.csv --retest examples/pairwise/run3.csv --retest examples/pairwise/run4.csv --retest examples/pairwise/run5.csv"
          set +e
          judge-kappa examples/pairwise/gold.csv examples/pairwise/run1.csv $runs --positive A --gate-margin 0.02
          test $? -eq 1
          judge-kappa examples/pairwise/gold.csv examples/pairwise/run1.csv $runs --positive A --gate-margin 0.5
